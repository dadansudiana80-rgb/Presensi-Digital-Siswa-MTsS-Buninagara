<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Presensi Online MTs Buninagara</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- HTML5 QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- SheetJS (Excel) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- JsBarcode for 1D Barcodes -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * {
            -webkit-tap-highlight-color: transparent;
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <div id="app" class="min-h-screen flex flex-col">
        <!-- Content dynamic injection -->
    </div>

    <!-- Notification Toast Modal -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 ease-in-out max-w-sm w-full bg-white rounded-xl shadow-2xl border border-slate-100 p-4 flex items-center space-x-3 pointer-events-none">
        <div id="toast-icon" class="w-10 h-10 rounded-full flex items-center justify-center text-white bg-green-500 shrink-0">
            <i class="fa-solid fa-check"></i>
        </div>
        <div class="flex-1">
            <p id="toast-title" class="font-bold text-sm text-slate-800">Pemberitahuan</p>
            <p id="toast-message" class="text-xs text-slate-500">Pesan sukses disini.</p>
        </div>
    </div>

    <!-- Custom Dialog Modal -->
    <div id="custom-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-all scale-95 opacity-0" id="modal-container">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                <h3 id="modal-title" class="text-lg font-bold text-slate-800">Judul Modal</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="modal-body" class="mb-6">
                <!-- Modal Body Dynamic -->
            </div>
            <div id="modal-footer" class="flex justify-end space-x-2 pt-3 border-t border-slate-100">
                <!-- Footer buttons dynamic -->
            </div>
        </div>
    </div>

    <script>
        // Default Data & State
        const DEFAULT_LOGO = "https://placehold.co/120x120/16a34a/ffffff?text=MTs+Buninagara";
        
        let appData = {
            currentUser: null, // { username, role, name, nip, mapel }
            logo: localStorage.getItem('mts_logo') || DEFAULT_LOGO,
            schoolAddress: localStorage.getItem('mts_schoolAddress') || 'Jl. Raya Buninagara, Kab. Tasikmalaya - Jawa Barat',
            headmaster: JSON.parse(localStorage.getItem('mts_headmaster')) || {
                name: 'H. Ahmad Dahlan, M.Ag.',
                nip: '197508122003121002',
                title: 'Kepala MTs Buninagara'
            },
            teachers: JSON.parse(localStorage.getItem('mts_teachers')) || [
                { id: 'G01', nip: '198501012010011001', name: 'Dadan, S.Pd.', mapel: 'Matematika', phone: '081234567890' },
                { id: 'G02', nip: '198802022012012002', name: 'Siti Aminah, S.Ag.', mapel: 'Bahasa Arab', phone: '082345678901' },
                { id: 'G03', nip: '199003032015011003', name: 'Ahmad Fauzi, M.Pd.', mapel: 'IPA Terpadu', phone: '083456789012' }
            ],
            accounts: JSON.parse(localStorage.getItem('mts_accounts')) || [
                { username: 'MTsbuninagara', name: 'Administrator MTs', role: 'admin', teacherId: null },
                { username: 'dadan', name: 'Dadan, S.Pd.', role: 'guru', teacherId: 'G01', pass: '123456' },
                { username: 'siti', name: 'Siti Aminah, S.Ag.', role: 'guru', teacherId: 'G02', pass: '123456' }
            ],
            students: JSON.parse(localStorage.getItem('mts_students')) || [
                { nis: '2324001', name: 'Ahmad Rizky', class: '7A', gender: 'L' },
                { nis: '2324002', name: 'Budi Santoso', class: '7A', gender: 'L' },
                { nis: '2324003', name: 'Citra Dewi', class: '7A', gender: 'P' },
                { nis: '2324004', name: 'Dina Maria', class: '7B', gender: 'P' },
                { nis: '2324005', name: 'Eko Prasetyo', class: '8A', gender: 'L' },
                { nis: '2324006', name: 'Fikri Haikal', class: '9A', gender: 'L' }
            ],
            attendance: JSON.parse(localStorage.getItem('mts_attendance')) || [
                { id: 1, date: '2026-09-25', nis: '2324001', name: 'Ahmad Rizky', class: '7A', mapel: 'Matematika', teacher: 'Dadan, S.Pd.', status: 'Hadir' },
                { id: 2, date: '2026-09-25', nis: '2324002', name: 'Budi Santoso', class: '7A', mapel: 'Matematika', teacher: 'Dadan, S.Pd.', status: 'Sakit' },
                { id: 3, date: '2026-09-25', nis: '2324003', name: 'Citra Dewi', class: '7A', mapel: 'Matematika', teacher: 'Dadan, S.Pd.', status: 'Hadir' }
            ],
            activeTab: 'dashboard'
        };

        // Save State Helper
        function saveData(key, value) {
            appData[key] = value;
            localStorage.setItem('mts_' + key, JSON.stringify(value));
        }

        function showToast(title, message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-message').innerText = message;
            
            if(type === 'error') {
                icon.className = 'w-10 h-10 rounded-full flex items-center justify-center text-white bg-red-500 shrink-0';
                icon.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
            } else {
                icon.className = 'w-10 h-10 rounded-full flex items-center justify-center text-white bg-green-500 shrink-0';
                icon.innerHTML = '<i class="fa-solid fa-check"></i>';
            }

            toast.classList.remove('translate-x-full');
            setTimeout(() => {
                toast.classList.add('translate-x-full');
            }, 3000);
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            container.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                document.getElementById('custom-modal').classList.add('hidden');
            }, 200);
        }

        function openModal(title, bodyHtml, footerButtonsHtml = '') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-footer').innerHTML = footerButtonsHtml;
            
            const modal = document.getElementById('custom-modal');
            const container = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            setTimeout(() => {
                container.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('login-username').value.trim();
            const passwordInput = document.getElementById('login-password').value.trim();

            // Admin Login Check
            if (usernameInput === 'MTsbuninagara' && passwordInput === 'Dadan.123') {
                appData.currentUser = {
                    username: 'MTsbuninagara',
                    name: 'Administrator MTs',
                    role: 'admin',
                    mapel: 'Semua Mapel'
                };
                showToast('Login Berhasil', 'Selamat datang Admin MTs Buninagara');
                renderApp();
                return;
            }

            // Teacher Login Check
            const acc = appData.accounts.find(a => a.username.toLowerCase() === usernameInput.toLowerCase());
            if (acc) {
                const passCheck = acc.pass || '123456';
                if (passwordInput === passCheck) {
                    const tInfo = appData.teachers.find(t => t.id === acc.teacherId) || {};
                    appData.currentUser = {
                        username: acc.username,
                        name: acc.name,
                        role: acc.role,
                        teacherId: acc.teacherId,
                        nip: tInfo.nip || '-',
                        mapel: tInfo.mapel || 'Mata Pelajaran'
                    };
                    showToast('Login Berhasil', `Selamat datang ${acc.name}`);
                    renderApp();
                    return;
                }
            }

            showToast('Login Gagal', 'Username atau Password salah!', 'error');
        }

        function handleLogout() {
            appData.currentUser = null;
            appData.activeTab = 'dashboard';
            renderApp();
            showToast('Logout', 'Anda telah keluar dari sistem.');
        }

        function renderApp() {
            const root = document.getElementById('app');

            if (!appData.currentUser) {
                root.innerHTML = renderLoginScreen();
                return;
            }

            root.innerHTML = `
                <!-- Main Header Navigation -->
                <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-30 no-print">
                    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <img src="${appData.logo}" alt="Logo MTs" class="w-10 h-10 rounded-full bg-white p-0.5 object-cover shadow">
                            <div>
                                <h1 class="font-bold text-base md:text-lg leading-tight">MTs Buninagara</h1>
                                <p class="text-xs text-emerald-200">Presensi Online Siswa</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <div class="text-right hidden sm:block">
                                <p class="font-semibold text-xs text-white">${appData.currentUser.name}</p>
                                <span class="inline-block px-2 py-0.5 text-[10px] rounded-full bg-emerald-700 text-emerald-100 font-medium uppercase">
                                    ${appData.currentUser.role} ${appData.currentUser.mapel ? `• ${appData.currentUser.mapel}` : ''}
                                </span>
                            </div>
                            <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center transition">
                                <i class="fa-solid fa-right-from-bracket sm:mr-1.5"></i>
                                <span class="hidden sm:inline">Keluar</span>
                            </button>
                        </div>
                    </div>
                </header>

                <div class="flex-1 flex flex-col md:flex-row max-w-7xl w-full mx-auto pb-16 md:pb-0">
                    <!-- Desktop Sidebar Nav -->
                    <aside class="w-full md:w-64 bg-white border-r border-slate-200 p-4 shrink-0 hidden md:block no-print">
                        <nav class="space-y-1">
                            ${renderNavItems()}
                        </nav>
                    </aside>

                    <!-- Main Dynamic Content Container -->
                    <main class="flex-1 p-4 md:p-6 overflow-x-hidden">
                        ${renderMainTabContent()}
                    </main>
                </div>

                <!-- Mobile Bottom Navigation (Android Friendly) -->
                <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-2 z-40 md:hidden no-print shadow-lg">
                    ${renderMobileNavItems()}
                </div>
            `;
        }

        function getNavList() {
            const isAdmin = appData.currentUser && appData.currentUser.role === 'admin';
            let navs = [
                { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                { id: 'presensi', label: 'Scan Absensi', icon: 'fa-qrcode' },
                { id: 'siswa', label: 'Data Siswa', icon: 'fa-user-graduate' }
            ];

            if (isAdmin) {
                navs.push({ id: 'guru', label: 'Guru & Mapel', icon: 'fa-chalkboard-user' });
                navs.push({ id: 'akun', label: 'Manajemen Akun', icon: 'fa-users-gear' });
            }

            navs.push({ id: 'rekap', label: 'Rekap Absensi', icon: 'fa-file-invoice' });
            navs.push({ id: 'pengaturan', label: 'Pengaturan', icon: 'fa-gear' });

            return navs;
        }

        function renderNavItems() {
            const list = getNavList();
            return list.map(item => {
                const active = appData.activeTab === item.id;
                return `
                    <button onclick="switchTab('${item.id}')" 
                        class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition ${active ? 'bg-emerald-50 text-emerald-700 font-bold border-l-4 border-emerald-600' : 'text-slate-600 hover:bg-slate-50'}">
                        <i class="fa-solid ${item.icon} w-5 text-center ${active ? 'text-emerald-600' : 'text-slate-400'}"></i>
                        <span>${item.label}</span>
                    </button>
                `;
            }).join('');
        }

        function renderMobileNavItems() {
            const list = getNavList().slice(0, 5); // display top 5 on mobile bar
            return list.map(item => {
                const active = appData.activeTab === item.id;
                return `
                    <button onclick="switchTab('${item.id}')" class="flex flex-col items-center justify-center text-[10px] font-medium transition ${active ? 'text-emerald-700 font-bold' : 'text-slate-500'}">
                        <i class="fa-solid ${item.icon} text-base mb-0.5 ${active ? 'text-emerald-600' : 'text-slate-400'}"></i>
                        <span>${item.label}</span>
                    </button>
                `;
            }).join('');
        }

        function switchTab(tabId) {
            appData.activeTab = tabId;
            renderApp();
        }

        function renderLoginScreen() {
            return `
                <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
                    <!-- Background Decoration -->
                    <div class="absolute -top-20 -left-20 w-80 h-80 bg-emerald-600 rounded-full blur-3xl opacity-30"></div>
                    <div class="absolute -bottom-20 -right-20 w-80 h-80 bg-teal-600 rounded-full blur-3xl opacity-30"></div>

                    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 relative z-10 border border-slate-100">
                        <div class="text-center mb-8">
                            <img src="${appData.logo}" alt="Logo" class="w-20 h-20 mx-auto rounded-full shadow-lg border-2 border-emerald-500 p-1 mb-3 object-cover">
                            <h2 class="text-2xl font-black text-slate-800 tracking-tight">MTs Buninagara</h2>
                            <p class="text-xs font-semibold text-emerald-600 uppercase tracking-widest mt-1">Aplikasi Presensi Online Siswa</p>
                        </div>

                        <form onsubmit="handleLogin(event)" class="space-y-5">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Username / NIP</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                                        <i class="fa-solid fa-user"></i>
                                    </span>
                                    <input type="text" id="login-username" required placeholder="Masukkan username" 
                                        class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Password</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>
                                    <input type="password" id="login-password" required placeholder="Masukkan password" 
                                        class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                                </div>
                            </div>

                            <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition flex items-center justify-center space-x-2">
                                <span>Masuk ke Sistem</span>
                                <i class="fa-solid fa-arrow-right text-sm"></i>
                            </button>
                        </form>

                        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                            <div class="p-3 bg-slate-50 rounded-xl text-xs text-slate-500">
                                <p class="font-bold text-slate-700 mb-1"><i class="fa-solid fa-key text-emerald-600 mr-1"></i> Informasi Akses Admin:</p>
                                <p>User: <span class="font-mono bg-slate-200 px-1 rounded">MTsbuninagara</span> | Pass: <span class="font-mono bg-slate-200 px-1 rounded">Dadan.123</span></p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMainTabContent() {
            switch(appData.activeTab) {
                case 'dashboard': return renderDashboardTab();
                case 'guru': return renderGuruTab();
                case 'akun': return renderAkunTab();
                case 'siswa': return renderSiswaTab();
                case 'presensi': return renderPresensiTab();
                case 'rekap': return renderRekapTab();
                case 'pengaturan': return renderPengaturanTab();
                default: return renderDashboardTab();
            }
        }

        function renderDashboardTab() {
            const today = new Date().toISOString().split('T')[0];
            const todayRecs = appData.attendance.filter(a => a.date === today);
            const hadirCount = todayRecs.filter(a => a.status === 'Hadir').length;
            const izinCount = todayRecs.filter(a => a.status === 'Izin' || a.status === 'Sakit').length;
            const alphaCount = todayRecs.filter(a => a.status === 'Alpha').length;

            return `
                <div class="space-y-6">
                    <!-- Banner Info -->
                    <div class="bg-gradient-to-r from-emerald-700 to-teal-800 text-white rounded-3xl p-6 shadow-xl relative overflow-hidden">
                        <div class="relative z-10">
                            <span class="bg-emerald-500/30 text-emerald-200 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Selamat Datang</span>
                            <h2 class="text-2xl font-black mt-2">${appData.currentUser.name}</h2>
                            <p class="text-xs text-emerald-100 mt-1 max-w-md">Sistem Presensi Online Berbasis QR Code MTs Buninagara. Kelola kehadiran siswa dengan cepat, presisi, dan terintegrasi.</p>
                            
                            <div class="mt-4 flex flex-wrap gap-2">
                                <button onclick="switchTab('presensi')" class="bg-white text-emerald-800 font-bold px-4 py-2 rounded-xl text-xs shadow hover:bg-emerald-50 transition flex items-center space-x-1.5">
                                    <i class="fa-solid fa-qrcode text-emerald-600"></i>
                                    <span>Mulai Scan Absensi</span>
                                </button>
                                <button onclick="switchTab('rekap')" class="bg-emerald-900/50 text-white font-semibold px-4 py-2 rounded-xl text-xs hover:bg-emerald-900/80 transition flex items-center space-x-1.5 border border-emerald-500/30">
                                    <i class="fa-solid fa-file-export"></i>
                                    <span>Lihat Laporan</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Ringkasan Statistik -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-3">
                            <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl shrink-0">
                                <i class="fa-solid fa-user-graduate"></i>
                            </div>
                            <div>
                                <p class="text-[11px] font-bold text-slate-400 uppercase">Total Siswa</p>
                                <p class="text-xl font-black text-slate-800">${appData.students.length}</p>
                            </div>
                        </div>

                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-3">
                            <div class="w-12 h-12 rounded-xl bg-green-50 text-green-600 flex items-center justify-center text-xl shrink-0">
                                <i class="fa-solid fa-user-check"></i>
                            </div>
                            <div>
                                <p class="text-[11px] font-bold text-slate-400 uppercase">Hadir Hari Ini</p>
                                <p class="text-xl font-black text-slate-800">${hadirCount}</p>
                            </div>
                        </div>

                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-3">
                            <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl shrink-0">
                                <i class="fa-solid fa-user-clock"></i>
                            </div>
                            <div>
                                <p class="text-[11px] font-bold text-slate-400 uppercase">Izin / Sakit</p>
                                <p class="text-xl font-black text-slate-800">${izinCount}</p>
                            </div>
                        </div>

                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-3">
                            <div class="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-xl shrink-0">
                                <i class="fa-solid fa-chalkboard-user"></i>
                            </div>
                            <div>
                                <p class="text-[11px] font-bold text-slate-400 uppercase">Total Guru</p>
                                <p class="text-xl font-black text-slate-800">${appData.teachers.length}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Aktivitas Presensi Terakhir -->
                    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-bold text-slate-800 text-sm flex items-center space-x-2">
                                <i class="fa-solid fa-clock-rotate-left text-emerald-600"></i>
                                <span>Aktivitas Presensi Terbaru</span>
                            </h3>
                            <button onclick="switchTab('rekap')" class="text-xs text-emerald-600 font-semibold hover:underline">Lihat Semua</button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs text-slate-600">
                                <thead class="bg-slate-50 uppercase text-[10px] text-slate-400 font-bold border-b border-slate-100">
                                    <tr>
                                        <th class="p-3">Tanggal</th>
                                        <th class="p-3">NIS & Nama</th>
                                        <th class="p-3">Kelas</th>
                                        <th class="p-3">Mata Pelajaran</th>
                                        <th class="p-3">Status</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">

        function generateAllAccounts() {
            let accounts = [...appData.accounts];
            let count = 0;

            appData.teachers.forEach(t => {
                const username = t.name.split(' ')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
                const exists = accounts.find(a => a.teacherId === t.id);
                if (!exists) {
                    accounts.push({
                        username: username,
                        name: t.name,
                        role: 'guru',
                        teacherId: t.id,
                        pass: '123456'
                    });
                    count++;
                }
            });

            saveData('accounts', accounts);
            renderApp();
            showToast('Auto Generate', `${count} akun guru baru berhasil dibuat dengan password default: 123456`);
        }

        function resetPass(username) {
            const newPass = prompt('Masukkan Password Baru untuk ' + username + ':', '123456');
            if (newPass) {
                let accounts = [...appData.accounts];
                const idx = accounts.findIndex(a => a.username === username);
                if (idx !== -1) {
                    accounts[idx].pass = newPass;
                    saveData('accounts', accounts);
                    renderApp();
                    showToast('Reset Password', 'Password berhasil diperbarui.');
                }
            }
        }

        function startScanner() {
            if (html5QrcodeScanner) {

            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader",
                { fps: 10, qrbox: { width: 250, height: 250 } },
                /* verbose= */ false
            );

            html5QrcodeScanner.render((decodedText, decodedResult) => {
                processAttendance(decodedText, 'Hadir');
            }, (error) => {
                // ignore scanning frame errors
            });
        }

        function stopScanner() {

        }

        function processAttendance(nis, status = 'Hadir') {
            const student = appData.students.find(s => s.nis === nis);
            if (!student) {
                showToast('Gagal Scan', `Siswa dengan NIS ${nis} tidak ditemukan!`, 'error');
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            const mapel = document.getElementById('scan-mapel')?.value || appData.currentUser.mapel || 'Pelajaran';

            let attendance = [...appData.attendance];

            // Cek apakah sudah absen untuk mapel dan tanggal hari ini
            const existingIdx = attendance.findIndex(a => a.nis === nis && a.date === today && a.mapel === mapel);

            const record = {
                id: Date.now(),
                date: today,
                nis: student.nis,
                name: student.name,
                class: student.class,
                mapel: mapel,
                teacher: appData.currentUser.name,
                status: status
            };

            if (existingIdx !== -1) {
                attendance[existingIdx] = record;
                showToast('Presensi Diperbarui', `${student.name} (${student.class}) diset ${status}`);
            } else {
                attendance.push(record);
                showToast('Presensi Berhasil', `${student.name} (${student.class}) Berhasil Absen ${status}!`);
            }

            saveData('attendance', attendance);
        }

        function getRekapData() {

            let studentsList = appData.students;
            if (selectedClass !== 'ALL') {
                studentsList = studentsList.filter(s => s.class === selectedClass);
            }

            return studentsList.map(s => {
                const recs = appData.attendance.filter(a => a.nis === s.nis && (selectedMapel ? a.mapel === selectedMapel : true));
                return {
                    nis: s.nis,
                    name: s.name,
                    class: s.class,
                    hadir: recs.filter(r => r.status === 'Hadir').length,
                    sakit: recs.filter(r => r.status === 'Sakit').length,
                    izin: recs.filter(r => r.status === 'Izin').length,
                    alpha: recs.filter(r => r.status === 'Alpha').length
                };
            });
        }

                        <h3 class="font-bold text-sm text-slate-800 flex items-center space-x-2">
                            <i class="fa-solid fa-image text-emerald-600"></i>
                            <span>Pengaturan Logo Madrasah (JPG / PNG)</span>
                        </h3>

                        <div class="flex items-center space-x-4">
                            <img id="logo-preview" src="${appData.logo}" alt="Logo" class="w-20 h-20 rounded-2xl object-cover border-2 border-dashed border-emerald-500 p-1">
                            <div>
                                <input type="file" id="upload-logo-input" accept="image/png, image/jpeg, image/jpg" class="hidden" onchange="previewAndSaveLogo(event)">
                                <button onclick="document.getElementById('upload-logo-input').click()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition">
                                    <i class="fa-solid fa-upload mr-1.5"></i> Unggah Logo Baru
                                </button>
                                <p class="text-[10px] text-slate-400 mt-1.5">Format JPG/PNG, Maksimal ukuran file 2MB.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Ganti Password -->
                    <div class="bg-white rounded-2xl border border-slate-100 p-6 shadow-sm space-y-4">
                        <h3 class="font-bold text-sm text-slate-800 flex items-center space-x-2">
                            <i class="fa-solid fa-lock text-emerald-600"></i>
                            <span>Ubah Password Akun (${appData.currentUser.name})</span>
                        </h3>

                        <form onsubmit="changeMyPassword(event)" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Password Baru</label>
                                <input type="password" id="my-new-pass" required placeholder="Masukkan password baru" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500">
                            </div>
                            <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition">
                                Ubah Password
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function saveSchoolAddress(e) {
            e.preventDefault();
            const addr = document.getElementById('school-address').value.trim();
            if (!addr) {
                showToast('Peringatan', 'Alamat Madrasah tidak boleh kosong!', 'error');
                return;
            }
            saveData('schoolAddress', addr);
            showToast('Sukses', 'Alamat Madrasah berhasil diperbarui.');
            renderApp();
        }

        function previewAndSaveLogo(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const base64Logo = evt.target.result;
                    appData.logo = base64Logo;
                    localStorage.setItem('mts_logo', base64Logo);
                    renderApp();
                    showToast('Logo Diperbarui', 'Logo MTs Buninagara berhasil diubah!');
                };
                reader.readAsDataURL(file);
            }
        }

        function saveHeadmaster(e) {
            e.preventDefault();
            const name = document.getElementById('hm-name').value.trim();
            const nip = document.getElementById('hm-nip').value.trim();
            const title = document.getElementById('hm-title').value.trim();

            if (!name) {
                showToast('Peringatan', 'Nama Kepala Madrasah wajib diisi!', 'error');
                return;
            }

            const hmObj = { name, nip, title };
            saveData('headmaster', hmObj);
            showToast('Sukses', 'Data Kepala Madrasah berhasil diperbarui.');
            renderApp();
        }

        function changeMyPassword(e) {
            e.preventDefault();
            const pass = document.getElementById('my-new-pass').value.trim();
            if (pass) {
                let accounts = [...appData.accounts];
                const idx = accounts.findIndex(a => a.username === appData.currentUser.username);
                if (idx !== -1) {
                    accounts[idx].pass = pass;
                    saveData('accounts', accounts);
                    showToast('Password Berhasil', 'Password Anda telah diperbarui.');
                    document.getElementById('my-new-pass').value = '';
                }
            }
        }

        function openExcelUploadModal(type) {
            const bodyHtml = `
                <div class="space-y-4 text-center">
                    <div class="p-6 border-2 border-dashed border-emerald-400 bg-emerald-50/50 rounded-2xl">
                        <i class="fa-solid fa-file-excel text-4xl text-emerald-600 mb-2"></i>
                        <p class="text-xs font-bold text-slate-700">Pilih File Excel (.xlsx / .xls)</p>
                        <p class="text-[10px] text-slate-400 mb-3">Format kolom harus sesuai template</p>
                        <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" class="w-full text-xs text-slate-500">
                    </div>
                    <button onclick="downloadExcelTemplate('${type}')" class="text-xs text-emerald-700 font-bold hover:underline">
                        <i class="fa-solid fa-download mr-1"></i> Unduh Contoh Format Excel ${type === 'guru' ? 'Guru' : 'Siswa'}
                    </button>
                </div>
            `;

            const footerButtons = `
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold">Batal</button>
                <button onclick="processExcelImport('${type}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md">Import Data</button>
            `;

            openModal(`Upload Excel Data ${type === 'guru' ? 'Guru' : 'Siswa'}`, bodyHtml, footerButtons);
        }

        function downloadExcelTemplate(type) {
            let data = [];
            if (type === 'guru') {
                data = [{ 'NIP': '198501012010011001', 'Nama Guru': 'Dadan, S.Pd.', 'Mapel': 'Matematika', 'No WA': '08123456789' }];
            } else {
                data = [{ 'NIS': '2324010', 'Nama Siswa': 'Rahmat Hidayat', 'Kelas': '7A', 'Jenis Kelamin (L/P)': 'L' }];
            }

            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Template");
            XLSX.writeFile(workbook, `Template_Import_${type}_MTs.xlsx`);
        }

        function processExcelImport(type) {
            const fileInput = document.getElementById('excel-file');
            if (!fileInput.files.length) {
                showToast('Peringatan', 'Silakan pilih file excel terlebih dahulu!', 'error');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                if (type === 'guru') {
                    let teachers = [...appData.teachers];
                    jsonData.forEach((row, idx) => {
                        teachers.push({
                            id: 'G' + String(teachers.length + 1).padStart(2, '0'),
                            nip: row['NIP'] || '-',
                            name: row['Nama Guru'] || 'Guru',
                            mapel: row['Mapel'] || 'Umum',
                            phone: row['No WA'] || '-'
                        });
                    });
                    saveData('teachers', teachers);
                } else {
                    let students = [...appData.students];
                    jsonData.forEach(row => {
                        if (row['NIS']) {
                            students.push({
                                nis: String(row['NIS']),
                                name: row['Nama Siswa'] || 'Siswa',
                                class: row['Kelas'] || '7A',
                                gender: row['Jenis Kelamin (L/P)'] || 'L'
                            });
                        }
                    });
                    saveData('students', students);
                }

                closeModal();
                renderApp();
                showToast('Import Berhasil', `Data ${type} berhasil diimpor dari Excel.`);
            };

            reader.readAsArrayBuffer(file);
        }

        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
